name: CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Mypy
        run: mypy src

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests with pytest and coverage
        run: |
          pytest --cov=fintech_algorithmic_trading --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml

  postgres-pipeline:
    name: PostgreSQL Pipeline & SQL Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt psycopg2-binary
          pip install -e .

      - name: Verify PostgreSQL schema and transformation execution
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d testdb -f src/fintech_algorithmic_trading/storage/sql/schema.sql
          psql -h localhost -U postgres -d testdb -f src/fintech_algorithmic_trading/storage/sql/clean_validate.sql

      - name: Validate database pipeline with mock data
        env:
          PGPASSWORD: postgres
        run: |
          python -c "
          import psycopg2
          from fintech_algorithmic_trading import PostgreSQLExportPipeline, ExportType

          conn = psycopg2.connect(host='localhost', port=5432, dbname='testdb', user='postgres', password='postgres')
          records = [
              {'trade_id': 'T1', 'symbol': 'AAPL', 'side': 'BUY', 'quantity': 100, 'entry_price': 150.0, 'exit_price': 155.0, 'entry_time': '2026-03-01T09:30:00Z', 'exit_time': '2026-03-01T15:00:00Z', 'pnl': 500.0, 'return_pct': 0.0333, 'commission': 1.0, 'holding_period_bars': 10},
              {'trade_id': 'T1', 'symbol': 'AAPL', 'side': 'BUY', 'quantity': 100, 'entry_price': 150.0, 'exit_price': 155.0, 'entry_time': '2026-03-01T09:30:00Z', 'exit_time': '2026-03-01T15:00:00Z', 'pnl': 500.0, 'return_pct': 0.0333, 'commission': 1.0, 'holding_period_bars': 10},
              {'trade_id': 'T_BAD', 'symbol': '', 'side': 'BUY', 'quantity': -5, 'entry_price': 0, 'exit_price': 0, 'entry_time': '2026-03-01T10:00:00Z', 'exit_time': '2026-03-01T09:00:00Z', 'pnl': 0, 'return_pct': 0, 'commission': -1, 'holding_period_bars': 0}
          ]
          summary = PostgreSQLExportPipeline.execute_db_pipeline(conn, ExportType.TRADES, records, init_schema=False)
          assert summary.total_raw_records == 3
          assert summary.valid_clean_records == 1
          assert summary.quarantined_records >= 1
          conn.close()
          print('PostgreSQL CI live validation successful.')
          "

  build:
    name: Build & Package Validation
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, postgres-pipeline]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution packages
        run: twine check dist/*

      - name: Test installation from wheel
        run: |
          python -m venv test_env
          . test_env/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python -c "import fintech_algorithmic_trading; print('Installed version:', fintech_algorithmic_trading.__version__)"
          fintech-algorithmic-trading --help
          risk-engine --help
          fintech-algorithmic-trading list-portfolios
          fintech-algorithmic-trading sql-schema
          fintech-algorithmic-trading sql-validate-script
          fintech-algorithmic-trading clean-export --data-type trades
          fintech-algorithmic-trading clean-export --data-type positions
          fintech-algorithmic-trading clean-export --data-type equity
          fintech-algorithmic-trading sql-generate-inserts --data-type trades
          fintech-algorithmic-trading sql-generate-copy --data-type trades
          fintech-algorithmic-trading sql-verify-exports
